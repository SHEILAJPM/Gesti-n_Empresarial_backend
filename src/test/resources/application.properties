spring.application.name=backend

# Los tests usan H2 en memoria en modo PostgreSQL: no necesitan Neon ni internet
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cada test crea las tablas desde las entidades; Flyway se prueba en EsquemaFlywayTest
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Las pruebas nunca llaman a APISUNAT
facturacion.proveedor=simulador
facturacion.apisunat.url=https://back.apisunat.com
facturacion.emisor.ruc=20000000001
facturacion.emisor.razon-social=PRINCIPE S.A.C.

# Las pruebas nunca llaman a Decolecta
consulta.decolecta.url=https://api.decolecta.com
consulta.decolecta.token=
