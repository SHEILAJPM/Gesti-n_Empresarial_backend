# Perfil "local": trabajar sin internet con H2 en disco, mismo esquema Flyway que Neon y datos de ejemplo.
# Arrancar con:  mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:file:./data/desarrollo_web_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.locations=classpath:db/migration,classpath:db/datos-ejemplo

# Usuarios de desarrollo: solo en este perfil, que usa una base H2 en tu computadora
usuarios.iniciales.admin=${ADMIN_PASSWORD:Admin123}
usuarios.iniciales.rrhh=${RRHH_PASSWORD:Rrhh123}
usuarios.iniciales.contabilidad=${CONTABILIDAD_PASSWORD:Conta123}
usuarios.iniciales.administracion=${ADMINISTRACION_PASSWORD:AdminArea123}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web H2: http://localhost:8080/h2-console  (JDBC URL igual a la de arriba, usuario sa, sin clave)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
