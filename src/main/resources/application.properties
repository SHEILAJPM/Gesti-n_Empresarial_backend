spring.application.name=backend

# Credenciales de Neon en backend/.env, generado con:  neon env pull --file backend/.env -s postgres
# (no se sube a git). NeonDataSourceEnvironmentPostProcessor las convierte a JDBC:
#   DATABASE_URL (pooled)          -> conexion de la aplicacion
#   DATABASE_URL_UNPOOLED (directa) -> migraciones Flyway
spring.config.import=optional:file:.env[.properties]

# Neon limita las conexiones: un pool chico basta. El timeout cubre el arranque en frio de Neon.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# El esquema lo maneja Flyway (db/migration); Hibernate solo valida que las entidades coincidan
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Los services mapean a DTO dentro de su transaccion; no hace falta mantener la sesion abierta en la vista
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Facturación electrónica. Con APISUNAT_PERSONA_ID y APISUNAT_PERSONA_TOKEN en backend/.env se usa APISUNAT
# (token del ambiente DESARROLLO: genera y valida el comprobante sin enviarlo a SUNAT); sin ellos, el simulador local.
facturacion.proveedor=${FACTURACION_PROVEEDOR:auto}
facturacion.apisunat.url=${APISUNAT_URL:https://back.apisunat.com}
facturacion.apisunat.persona-id=${APISUNAT_PERSONA_ID:}
facturacion.apisunat.persona-token=${APISUNAT_PERSONA_TOKEN:}
# Empresa emisora (la configurada en APISUNAT; por defecto la empresa ficticia de pruebas)
facturacion.emisor.ruc=${EMISOR_RUC:20000000001}
facturacion.emisor.razon-social=${EMISOR_RAZON_SOCIAL:PRINCIPE S.A.C.}
facturacion.emisor.nombre-comercial=${EMISOR_NOMBRE_COMERCIAL:}
facturacion.emisor.direccion=${EMISOR_DIRECCION:}
facturacion.emisor.ubigeo=${EMISOR_UBIGEO:150101}

# Consulta de DNI (RENIEC) y RUC (SUNAT) para autocompletar nombres. Token gratuito en https://decolecta.com/profile
consulta.decolecta.url=${DECOLECTA_URL:https://api.decolecta.com}
consulta.decolecta.token=${DECOLECTA_TOKEN:}
