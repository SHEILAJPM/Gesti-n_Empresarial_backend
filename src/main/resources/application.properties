spring.application.name=backend

# Credenciales de Neon en backend/.env, generado con:  neon env pull --file backend/.env -s postgres
# (no se sube a git). NeonDataSourceEnvironmentPostProcessor las convierte a JDBC:
#   DATABASE_URL (pooled)          -> conexion de la aplicacion
#   DATABASE_URL_UNPOOLED (directa) -> migraciones Flyway
spring.config.import=optional:file:.env[.properties]

# Neon limita las conexiones: un pool chico basta. El timeout cubre el arranque en frio de Neon.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
# Neon cierra las conexiones inactivas (y al dormir el cómputo): se renuevan antes y se mantienen vivas,
# así el pool no entrega una conexión ya cerrada ("This connection has been closed")
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.minimum-idle=1

# El esquema lo maneja Flyway (db/migration); Hibernate solo valida que las entidades coincidan
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Los services mapean a DTO dentro de su transaccion; no hace falta mantener la sesion abierta en la vista
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Contraseñas de los usuarios que se crean al primer arranque (backend/.env). Sin valor, ese usuario no se crea.
usuarios.iniciales.admin=${ADMIN_PASSWORD:}
usuarios.iniciales.rrhh=${RRHH_PASSWORD:}
usuarios.iniciales.contabilidad=${CONTABILIDAD_PASSWORD:}
usuarios.iniciales.administracion=${ADMINISTRACION_PASSWORD:}

# Facturación electrónica. Con APISUNAT_PERSONA_ID y APISUNAT_PERSONA_TOKEN en backend/.env se usa APISUNAT
# (token del ambiente DESARROLLO: genera y valida el comprobante sin enviarlo a SUNAT); sin ellos, el simulador local.
facturacion.proveedor=${FACTURACION_PROVEEDOR:auto}
facturacion.apisunat.url=${APISUNAT_URL:https://back.apisunat.com}
facturacion.apisunat.persona-id=${APISUNAT_PERSONA_ID:}
facturacion.apisunat.persona-token=${APISUNAT_PERSONA_TOKEN:}
# Empresa emisora (la configurada en APISUNAT; por defecto la empresa ficticia de pruebas)
facturacion.emisor.ruc=${EMISOR_RUC:20000000001}
facturacion.emisor.razon-social=${EMISOR_RAZON_SOCIAL:PRINCIPE S.A.C.}
facturacion.emisor.nombre-comercial=${EMISOR_NOMBRE_COMERCIAL:}
facturacion.emisor.direccion=${EMISOR_DIRECCION:}
facturacion.emisor.ubigeo=${EMISOR_UBIGEO:150101}

# Consulta de DNI (RENIEC) y RUC (SUNAT) para autocompletar nombres. Token gratuito en https://decolecta.com/profile
consulta.decolecta.url=${DECOLECTA_URL:https://api.decolecta.com}
consulta.decolecta.token=${DECOLECTA_TOKEN:}

# Planilla: valores legales que cambian. Verificar y actualizar cuando se publiquen los nuevos.
# UIT del año (deducción de 7 UIT y tramos de renta de 5ta), remuneración mínima vital (base mínima de EsSalud)
# y remuneración máxima asegurable de la SBS (tope de la prima de seguro AFP, cambia cada trimestre).
planilla.uit=${PLANILLA_UIT:5500.00}
planilla.rmv=${PLANILLA_RMV:1130.00}
planilla.rma=${PLANILLA_RMA:12234.34}

# Orígenes (frontend) que pueden llamar a la API desde el navegador, separados por coma.
# En producción: la URL pública del frontend. Admite patrones, p. ej. http://192.168.1.*:4200 para probar en el celular.
cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://127.0.0.1:4200}

# Fotos de asistencia: días que se guardan antes de borrarse (0 = nunca). La marcación se conserva sin la imagen.
asistencia.fotos.retencion-dias=${FOTOS_RETENCION_DIAS:180}

# Sesiones con JWT: clave de firma (JWT_SECRET en .env, mínimo 32 caracteres) y horas de validez del token
seguridad.jwt.secreto=${JWT_SECRET:}
seguridad.jwt.horas=${JWT_HORAS:8}
